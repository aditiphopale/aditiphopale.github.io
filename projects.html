<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Aditi Phopale</title>
<meta name="description" content="Projects by Aditi Phopale, pulled live from GitHub.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="bg-canvas" aria-hidden="true"></canvas>

<header class="site-header">
  <div class="wrap nav">
    <a href="/" class="brand">aditi.</a>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="https://github.com/aditiphopale" target="_blank" rel="noopener">GitHub</a></li>
    </ul>
  </div>
</header>

<main>
  <div class="wrap">
    <h1 class="page-title">Projects</h1>
    <p class="page-sub">Pulled live from <a href="https://github.com/aditiphopale" target="_blank" rel="noopener">github.com/aditiphopale</a> — no manual updates needed.</p>

    <div id="project-grid" class="project-grid">
      <p class="state-msg">Loading projects&hellip;</p>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    &copy; <span id="year"></span> Aditi Phopale
    <span class="sep">&middot;</span>
    <a href="https://github.com/aditiphopale" target="_blank" rel="noopener">GitHub</a>
  </div>
</footer>

<script src="js/particles.js" defer></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const GITHUB_USERNAME = 'aditiphopale';
  const grid = document.getElementById('project-grid');
  const HIDE_FORKS = true;

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function formatDate(iso) {
    return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'short' });
  }

  async function loadProjects() {
    try {
      const res = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&per_page=100`);
      if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
      let repos = await res.json();

      if (HIDE_FORKS) repos = repos.filter(r => !r.fork);

      if (repos.length === 0) {
        grid.innerHTML = '<div class="empty-state">No projects live yet — this section is ready to go the moment the first one is.</div>';
        return;
      }

      grid.innerHTML = repos.map(r => `
        <div class="project-card">
          <h3><a href="${r.html_url}" target="_blank" rel="noopener">${escapeHtml(r.name)}</a></h3>
          <p class="desc">${escapeHtml(r.description) || 'No description provided.'}</p>
          <div class="project-meta">
            ${r.language ? `<span><span class="lang-dot"></span>${escapeHtml(r.language)}</span>` : ''}
            <span>&#9733; ${r.stargazers_count}</span>
            <span>Updated ${formatDate(r.updated_at)}</span>
          </div>
        </div>
      `).join('');
    } catch (err) {
      grid.innerHTML = `<div class="empty-state">Couldn't load projects right now. View them directly on <a href="https://github.com/${GITHUB_USERNAME}" target="_blank" rel="noopener">GitHub</a>.</div>`;
      console.error(err);
    }
  }

  loadProjects();
</script>

</body>
</html>
