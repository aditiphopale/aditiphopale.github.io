<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditi Phopale</title>
<meta name="description" content="Aditi Phopale — AI and everything around it.">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<canvas id="bg-canvas" aria-hidden="true"></canvas>
<header class="site-header">
  <div class="wrap nav">
    <a href="/" class="brand">Aditi Phopale</a>
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/about/">About</a></li>
      <li><a href="/projects/">Projects</a></li>
      <li><a href="/blog/">Blog</a></li>
    </ul>
  </div>
</header>
<main>
  <div class="wrap">
    <section class="hero">
      <div class="badge"><span class="dot"></span>DATA ENGINEER &middot; SEATTLE</div>
      <h1 aria-label="AI and everything around it."><span id="typed-text" aria-hidden="true"></span><span class="cursor" aria-hidden="true">|</span></h1>
      <p class="tagline">An evolving collection of what I'm learning, questioning, and building along the way.</p>
      <div class="cta">
        <a href="/blog/" class="btn primary">Read the Blog &rarr;</a>
        <a href="/projects/" class="btn ghost">See the Projects</a>
      </div>
    </section>
  </div>
</main>
<footer>
  <div class="wrap">
    &copy; <span id="year"></span> Aditi Phopale
  </div>
</footer>
<script src="/js/particles.js" defer></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  (function () {
    const target = document.getElementById('typed-text');
    if (!target) return;

    const tokens = [
      '<span class="accent">', 'A', 'I', '</span>',
      ...' and everything around it.'.split('')
    ];

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    if (reduceMotion) {
      target.innerHTML = tokens.join('');
      return;
    }

    let i = 0;
    function tick() {
      i++;
      target.innerHTML = tokens.slice(0, i).join('');
      if (i < tokens.length) {
        setTimeout(tick, 45);
      }
    }
    setTimeout(tick, 300);
  })();
</script>
</body>
</html>
